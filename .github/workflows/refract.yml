name: Refract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: macOS 27 build and tests
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test
        run: swift test --disable-sandbox --skip OfflineBatchTests
      - name: Build release configuration
        run: swift build --disable-sandbox -c release --arch arm64

  release:
    name: Package and publish private build
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event.repository.private
    runs-on: xcode-27
    timeout-minutes: 35
    concurrency:
      group: refract-private-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')"
          if printf '%s\n' "$releases" | grep -Fxq "$tag"; then
            echo "Release $tag already exists."
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        if: steps.version.outputs.tag != ''
        with:
          version: '0.13.10'
          enable-cache: false
      - name: Package app and verify signature
        if: steps.version.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          scripts/runtime.sh
          scripts/package.sh
          codesign --verify --deep --strict build/Refract.app
          /usr/bin/ditto -c -k --keepParent build/Refract.app "build/Refract-${RELEASE_TAG}-arm64.zip"
          cd build
          shasum -a 256 "Refract-${RELEASE_TAG}-arm64.zip" > SHA256SUMS.txt
      - name: Publish private release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" --jq ".[] | select(.ref == \"refs/tags/$RELEASE_TAG\") | .ref")"
          test -z "$existing"
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Refract ${RELEASE_TAG#v}" \
            --notes "Personal build for Apple Silicon Macs running macOS 27 or later. The app is ad-hoc signed and bundles its Python runtime. Model weights are managed separately in the app." \
            "build/Refract-${RELEASE_TAG}-arm64.zip" build/SHA256SUMS.txt build/provenance.json
